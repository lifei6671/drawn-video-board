[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawn-video-board"
version = "1.0.0"
description = "人工审核驱动的独立 Codex 手绘视频工作流"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "opencv-python>=4.9", "Pillow>=10", "av>=12",
  "fastapi==0.116.1", "uvicorn[standard]==0.35.0", "python-multipart==0.0.20",
  "httpx==0.28.1", "gradio_client==1.13.1", "opencc-python-reimplemented==0.1.7", "PyYAML==6.0.3"
]

[project.scripts]
drawn-video-board = "cs_board_video:main"

[tool.setuptools]
packages = ["cs_board_video", "cs_board_video.adapters", "cs_board_video.upstream"]

